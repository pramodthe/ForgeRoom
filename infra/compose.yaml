# Local development dependencies only. Do not use these credentials outside this machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forgeroom
      POSTGRES_PASSWORD: forgeroom
      POSTGRES_DB: forgeroom
    ports:
      - "5432:5432"
    volumes:
      - forgeroom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeroom -d forgeroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgeroom_pg:
