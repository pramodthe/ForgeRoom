# Qodo Code Review configuration for the GitHub App integration.
# The GitHub installation is still authorized once in the Qodo portal by a
# repository admin; this file makes the review behavior reproducible in git.

[github_app]
pr_commands = [
    "/agentic_describe",
    "/agentic_review",
]
handle_push_trigger = true
push_commands = [
    "/agentic_review",
]

[review_agent]
comments_location_policy = "both"
inline_comments_severity_threshold = 3
persistent_comment_notification = true
demand_self_review = true
approve_pr_on_self_review = false
issues_user_guidelines = "Review production changes for correctness, security, reliability, observability, and maintainability. Prioritize actionable findings and verify that changes preserve the TrueForge agent harness safety boundary, approval gates, reconnect behavior, and tool authorization semantics."
compliance_user_guidelines = "Check that the pull request stays within its stated scope, documents tests and configuration impact, preserves required human approval before irreversible actions, and does not introduce secrets or unsafe defaults."

[review_agent_ux]
show_context_used = true
show_persistent_review_section = true
severity_terminology = "high_medium_low"

[checks]
enable_auto_checks_feedback = true
persistent_comment = true

# Keep remediation human-controlled so every fix is reviewed and merged by a
# team member, which preserves an auditable PR trail.
[fixer_agent]
enable = false
enable_auto_fix = false
