name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgeroom
          POSTGRES_PASSWORD: forgeroom
          POSTGRES_DB: forgeroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeroom -d forgeroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://forgeroom:forgeroom@localhost:5432/forgeroom
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @forgeroom/e2e exec playwright install --with-deps chromium
      - name: Browser E2E (prototype)
        run: pnpm test:e2e
        env:
          CI: true
      - name: Browser E2E (live API smoke)
        run: pnpm test:e2e
        env:
          CI: true
          FORGEROOM_E2E_LIVE: api
          HOST: 127.0.0.1
          PORT: "3000"
          APP_ORIGIN: http://127.0.0.1:5173
          OWNER_EMAIL: owner@example.test
          OWNER_PASSWORD: correct-horse-battery
          FORGEROOM_E2E_OWNER_PASSWORD: correct-horse-battery
          FORGEROOM_EMBED_WORKER: "true"
